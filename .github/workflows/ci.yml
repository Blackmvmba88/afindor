name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
