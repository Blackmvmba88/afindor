name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Six-string DSP validation
        run: python scripts/validate_dsp.py
      - name: Ruff
        run: ruff check src tests scripts
