[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-tuner"
version = "0.1.0"
description = "Low-latency chromatic guitar tuner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "sounddevice>=0.5",
  "librosa>=0.11",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
blackmamba-tuner = "blackmamba_tuner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
